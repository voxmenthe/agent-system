model_context_window = 371000
model_auto_compact_token_limit = 235000
model_auto_compact_token_limit_scope = "body_after_prefix"
tool_output_token_limit = 15000
plan_mode_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
experimental_compact_prompt_file = "@HOME@/.codex2/prompts/compact.md"
personality = "none"

[memories]
extract_model = "gpt-6.1-terra"
consolidation_model = "gpt-6.1-sol"

[agents]
enabled = true
# Counts subagents only; the primary agent is additional.
max_concurrent_threads_per_session = 4
max_depth = 1

[features]
multi_agent = true

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[features.context_management]
experimental_mode = true

# Claude in Chrome browser tools, served by an undocumented Claude Code flag.
[mcp_servers.claude_in_chrome]
command = "@HOME@/.local/bin/claude"
args = ["--claude-in-chrome-mcp"]
tool_timeout_sec = 120

[mcp_servers.lovable]
url = "https://mcp.lovable.dev"
[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "memory codex-hook"
timeout = 3
statusMessage = "Loading memory turn context"
additionalContextLimit = 800

[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "memory codex-hook"
timeout = 3
statusMessage = "Loading memory recovery checkpoint"
additionalContextLimit = 800

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "hist hook codex SessionStart"
timeout = 5
statusMessage = "Loading session history"
additionalContextLimit = 8000

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "hist hook codex SubagentStart"
timeout = 5
statusMessage = "Loading session history"
additionalContextLimit = 8000
