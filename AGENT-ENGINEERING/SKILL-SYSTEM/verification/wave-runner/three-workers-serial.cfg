\* Every safety property with three workers one at a time, without
\* --timeout: the smallest wave where a barred worker sits between two others.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Launchers = {"L", "M"}
    Accounts = {"A", "B"}
    AccountOf <- SharedAccount
    JobChoices = {1}
    TimeoutChoices = {FALSE}
    MaxIOFailures = 1
    Mutants = {}
INVARIANTS
    TypeOK
    ActiveCounts
    CapRespected
    NoLaunchAfterRunnerFailure
    NoBarredLaunch
    AccountBarsNeedExhaustion
    InterruptStopsDispatch
    EveryWorkerHasAStatus
    NoUnreportedLiveGroup
    StatusFilesMatch
    ExitZeroIsClean
    TimeoutIsReported
PROPERTIES
    SettledStatusesSurvive
