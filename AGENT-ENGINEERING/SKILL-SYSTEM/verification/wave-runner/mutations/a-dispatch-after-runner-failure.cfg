\* Line 284 without runner_failed == 0, as it stood before 1ad297d4a: a
\* barred worker's failed status write sets runner_failed inside the
\* dispatch loop, and the next worker still starts.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Launchers = {"L", "M"}
    Accounts = {"A", "B"}
    AccountOf <- SharedAccount
    JobChoices = {1}
    TimeoutChoices = {FALSE}
    MaxIOFailures = 1
    Mutants = {"a"}
INVARIANT NoLaunchAfterRunnerFailure
