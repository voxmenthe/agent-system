\* Every safety property: two workers, every launcher assignment (L and M
\* on one account), every --jobs value, with and without --timeout, at most
\* one failed write.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Launchers = {"L", "M"}
    Accounts = {"A", "B"}
    AccountOf <- SharedAccount
    JobChoices = {1, 2}
    TimeoutChoices = {FALSE, TRUE}
    MaxIOFailures = 1
    Mutants = {}
INVARIANTS
    TypeOK
    ActiveCounts
    CapRespected
    NoLaunchAfterRunnerFailure
    NoBarredLaunch
    AccountBarsNeedExhaustion
    InterruptStopsDispatch
    EveryWorkerHasAStatus
    NoUnreportedLiveGroup
    StatusFilesMatch
    ExitZeroIsClean
    TimeoutIsReported
PROPERTIES
    SettledStatusesSurvive
