\* The runner always exits: with --timeout even if the adapter never exits,
\* and without it once it does. One worker, with and without --timeout, at
\* most one failed write; TLC's liveness check does not finish for two.
SPECIFICATION FairSpec
CONSTANTS
    N = 1
    Launchers = {"L", "M"}
    Accounts = {"A", "B"}
    AccountOf <- SharedAccount
    JobChoices = {1}
    TimeoutChoices = {FALSE, TRUE}
    MaxIOFailures = 1
    Mutants = {}
PROPERTY Termination
