\* Every property, two skills, four operations: journal-write stops and
\* newest-first rollbacks, as in journal-stops.cfg, one operation deeper.
SPECIFICATION Spec
CONSTANTS
    Skills = {"X", "Y"}
    MaxOps = 4
    StopWindows = {"journal"}
    RollbackOrder = "newest"
    Mutants = {}
INVARIANTS
    TypeOK
    NoStuckRollback
    StatusAgrees
PROPERTIES
    RollbackRestores
    RollbackStaysOnItsSkill
CHECK_DEADLOCK FALSE
